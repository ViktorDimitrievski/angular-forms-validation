<form [formRoot]="form">
  <div class="form-field">
    <label>Password*</label>
    <input type="text" [formField]="form.password" />
    <error [state]="form.password()" />
  </div>
  <div class="form-field">
    <label>Confirm Password*</label>
    <input type="text" [formField]="form.confirmPassword" />
    <error [state]="form.confirmPassword()" />
    <error [state]="form.confirmPassword()" kind="passwordMismatch" />
  </div>
  <button type="submit">Submit</button>
</form>
