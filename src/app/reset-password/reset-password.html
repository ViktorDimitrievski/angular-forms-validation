<form class="form" [formRoot]="form">
  <div class="form-field" [errorClass]="form.password()">
    <label class="form-field__label">Password*</label>
    <input class="form-field__input" type="text" [formField]="form.password" />
    <error [state]="form.password()" />
  </div>
  <div class="form-field" [errorClass]="form.confirmPassword()">
    <label class="form-field__label">Confirm Password*</label>
    <input class="form-field__input" type="text" [formField]="form.confirmPassword" />
    <error [state]="form.confirmPassword()" />
    <error [state]="form.confirmPassword()" kind="passwordMismatch" />
  </div>
  <button class="btn" type="submit">Submit</button>
</form>
